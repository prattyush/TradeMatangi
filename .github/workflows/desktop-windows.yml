name: Desktop Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'windowsapp/**'
      - 'shared/**'
      - 'frontend/src/services/**'
      - 'scripts/fetch-ffmpeg.py'
      - '.github/workflows/desktop-windows.yml'

jobs:
  bundle:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windowsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windowsapp/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Trading Video Maker: bundle the pinned FFmpeg (checked against a SHA-256 in the script).
      - run: python ../scripts/fetch-ffmpeg.py
      - run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.ffmpeg.conf.json
      - name: Check ffmpeg is bundled
        shell: bash
        run: |
          test -f src-tauri/target/release/ffmpeg.exe
          ls -l src-tauri/target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: TradeMatangi-Charts-Windows-installer
          path: windowsapp/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
