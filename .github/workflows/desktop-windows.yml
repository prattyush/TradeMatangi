name: Desktop Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'windowsapp/**'
      - '.github/workflows/desktop-windows.yml'

jobs:
  bundle:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windowsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windowsapp/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: TradeMatangi-Charts-Windows-installer
          path: windowsapp/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
