name: Desktop Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'windowsapp/**'
      - 'shared/**'
      - 'frontend/src/services/**'
      - 'scripts/fetch-ffmpeg.py'
      - '.github/workflows/desktop-windows.yml'

jobs:
  bundle:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windowsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windowsapp/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      # Rust build cache: most runs skip the 5-6 minute compile, and a retry below reuses it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windowsapp/src-tauri
      # Tauri downloads NSIS (the installer maker) from GitHub on first use. Caching it avoids that
      # download on later runs; a 504 from GitHub once failed the whole build.
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-tools-${{ runner.os }}-nsis-3.11
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Trading Video Maker: bundle the pinned FFmpeg (checked against a SHA-256 in the script).
      - run: python ../scripts/fetch-ffmpeg.py
      # GitHub release downloads (NSIS, its plugin) sometimes answer 504. A retry reuses the compiled
      # app from the first attempt, so only the download is repeated.
      - name: Build the installer (up to 3 attempts)
        shell: pwsh
        run: |
          $max = 3
          for ($attempt = 1; $attempt -le $max; $attempt++) {
            npm run tauri build -- --bundles nsis --config src-tauri/tauri.ffmpeg.conf.json
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "::warning::Installer build attempt $attempt of $max failed (exit code $LASTEXITCODE)"
            if ($attempt -lt $max) { Start-Sleep -Seconds (30 * $attempt) }
          }
          exit 1
      # The installed app finds ffmpeg.exe next to its own exe, put there by the installer, so the
      # installer is what is checked. tauri-build also copies ffmpeg.exe into target/release; that copy
      # went missing when the runner's Rust moved from 1.99 to 1.100 (the build still succeeded), so
      # it only warns.
      - name: Check ffmpeg is bundled
        shell: bash
        run: |
          installer=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -n 1)
          ls -l "$installer"
          if [ ! -f src-tauri/target/release/ffmpeg.exe ]; then
            echo "::warning::src-tauri/target/release/ffmpeg.exe was not copied by tauri-build; checking the installer itself"
            find src-tauri/target -name 'ffmpeg*.exe' -not -path '*/bundle/*' | head -n 5
          fi
          "/c/Program Files/7-Zip/7z.exe" l "$installer" | tee installer-files.txt | grep -i 'ffmpeg\.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: TradeMatangi-Charts-Windows-installer
          path: windowsapp/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
